[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pycommflag"
version = "0.2.0"
description = "Commercial flagging for TV recordings; a drop-in replacement for mythcommflag"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "av>=14.0.0",
    "scipy>=1.10.0",
    "numpy>=1.26.4",
    "tensorflow>=2.16.0",
    "scikit_image>=0.20.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
mythtv = ["mysqlclient>=2.2.8"]
yaml = ["pyyaml>=6.0"]
all = ["mysqlclient>=2.2.8", "pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/b-pass/pycommflag"

[project.scripts]
pycommflag = "pycommflag.__main__:main"

[tool.setuptools]
packages = ["pycommflag", "pycommflag.extern"]
